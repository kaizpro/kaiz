name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, ESLint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Auth and archive regression tests
        run: node --test tests/auth.test.mjs tests/problem-performances.test.mjs tests/problem-workflows.test.mjs tests/personal-practice.test.mjs

      - name: Content import and competition results regression tests
        run: node --test tests/content-import.test.mjs tests/competition-results.test.mjs

      - name: Learning and pathfinder regression tests
        run: node --test tests/learning-curriculum.test.mjs tests/learning-presentation.test.mjs tests/pathfinder.test.mjs tests/learning-progress.test.mjs tests/progress-experience.test.mjs tests/beginner-sequence.test.mjs tests/ioai-content-quality.test.mjs tests/ioai-guidance.test.mjs tests/ioai-navigation.test.mjs tests/ioai-presentation.test.mjs tests/ioai-roadmap.test.mjs tests/classic-roadmaps.test.mjs

      - name: Production build
        # Non-credentials deliberately activate the configured Auth path. An
        # unconfigured build previously concealed cookie-driven dynamic Learn.
        env:
          NEXT_PUBLIC_SITE_URL: https://kaizpro.com
          NEXT_PUBLIC_SUPABASE_URL: https://cache-regression.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-test-not-a-credential
        run: npm run build

      - name: Public Learn cache and authorization regression tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://cache-regression.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-test-not-a-credential
        run: |
          node --test tests/learn-cache.test.mjs
          node tests/learn-cache.build.mjs
